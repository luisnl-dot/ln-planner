<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>Martin Social – Profilvorschau</title>
<link rel="stylesheet" href="basis.css" />
<style>
  /* Schematische Profilansicht (kein Instagram-Screenshot): zeigt, wie Raster, Bio und Highlights zusammenwirken */
  .profil { width: 1080px; height: 2610px; background: #ffffff; color: #0e0f0f; font-family: 'Archivo', sans-serif; padding: 0; display: block; }
  .leiste-oben { height: 120px; display: flex; align-items: center; justify-content: center; gap: 14px; font-size: 40px; font-weight: 700; font-stretch: 100%; border-bottom: 1px solid #e4e4e4; }
  .kopfzeile { display: flex; align-items: center; gap: 60px; padding: 40px 44px 0; }
  .bild { width: 240px; height: 240px; border-radius: 50%; overflow: hidden; flex: none; box-shadow: 0 0 0 4px #fff, 0 0 0 6px #dcdcdc; }
  .bild img { width: 100%; height: 100%; }
  .zahlen { display: flex; gap: 70px; }
  .zahlen div { text-align: left; }
  .zahlen b { display: block; font-size: 44px; font-weight: 700; }
  .zahlen span { font-size: 32px; color: #555; }
  .bio { padding: 30px 44px 0; font-size: 34px; line-height: 1.4; }
  .bio b { font-weight: 700; }
  .bio .grau { color: #737373; }
  .bio .link { color: #00376b; font-weight: 600; }
  .knoepfe { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; padding: 30px 44px 0; }
  .knoepfe div { background: #efefef; border-radius: 16px; text-align: center; font-size: 32px; font-weight: 650; padding: 18px 0; }
  .highlights { display: flex; gap: 34px; padding: 40px 44px 0; overflow: hidden; }
  .highlights figure { margin: 0; width: 150px; flex: none; text-align: center; }
  .highlights .kreis { width: 150px; height: 150px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 4px #fff, 0 0 0 6px #dbdbdb; }
  .highlights img { width: 100%; height: 100%; }
  .highlights figcaption { font-size: 26px; margin-top: 16px; }
  .reiter { display: grid; grid-template-columns: 1fr 1fr 1fr; margin-top: 44px; border-top: 1px solid #e4e4e4; }
  .reiter div { height: 100px; display: flex; align-items: center; justify-content: center; font-family: 'Plex', monospace; font-size: 24px; letter-spacing: 0.1em; text-transform: uppercase; color: #8a8a8a; }
  .reiter div:first-child { color: #0e0f0f; box-shadow: inset 0 -4px 0 #0e0f0f; }
  .raster { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .raster div { aspect-ratio: 3 / 4; overflow: hidden; background: #ddd; }
  .raster img { width: 100%; height: 100%; object-fit: cover; display: block; }
</style>
</head>
<body>
<section class="karte profil" data-name="profilvorschau" data-format="png">
  <div class="leiste-oben">motorrad_martin</div>
  <div class="kopfzeile">
    <div class="bild"><img src="../export/profil-und-highlights/profilbild.png" alt="" /></div>
    <div class="zahlen">
      <div><b>[–]</b><span>Beiträge</span></div>
      <div><b>[–]</b><span>Follower</span></div>
      <div><b>[–]</b><span>Gefolgt</span></div>
    </div>
  </div>
  <div class="bio">
    <b>BMW Motorrad Martin</b><br />
    <span class="grau">Motorradhändler</span><br />
    BMW Motorrad Vertragshändler seit 1954, dritte Generation.<br />
    Weyarn · Schongau · Oy-Mittelberg<br />
    /// Home of Martin Edition<br />
    <span class="link">motorrad-martin.de</span>
  </div>
  <div class="knoepfe"><div>Folgen</div><div>Nachricht</div><div>Kontakt</div></div>
  <div class="highlights">
    <figure><div class="kreis"><img src="../export/profil-und-highlights/highlight-1-edition.png" alt="" /></div><figcaption>Edition</figcaption></figure>
    <figure><div class="kreis"><img src="../export/profil-und-highlights/highlight-2-uebergaben.png" alt="" /></div><figcaption>Übergaben</figcaption></figure>
    <figure><div class="kreis"><img src="../export/profil-und-highlights/highlight-3-werkstatt.png" alt="" /></div><figcaption>Werkstatt</figcaption></figure>
    <figure><div class="kreis"><img src="../export/profil-und-highlights/highlight-4-haeuser.png" alt="" /></div><figcaption>Häuser</figcaption></figure>
    <figure><div class="kreis"><img src="../export/profil-und-highlights/highlight-5-neu.png" alt="" /></div><figcaption>Neu</figcaption></figure>
  </div>
  <div class="reiter"><div>Beiträge</div><div>Reels</div><div>Markiert</div></div>
  <div class="raster">
    <div><img src="../export/feed-4x5/01-edition-triple-black.jpg" alt="" /></div>
    <div><img src="../export/feed-4x5/02a-karussell-manufaktur-titel.jpg" alt="" /></div>
    <div><img src="../export/feed-4x5/07-seit-1954.jpg" alt="" /></div>
    <div><img src="../export/feed-4x5/03-uebergabe-margis.jpg" alt="" /></div>
    <div><img src="../export/feed-4x5/06-haus-weyarn.jpg" alt="" /></div>
    <div><img src="../export/feed-4x5/04a-karussell-winter-titel.jpg" alt="" /></div>
    <div><img src="../export/feed-4x5/09-karriere-serviceberater.jpg" alt="" /></div>
    <div><img src="../export/feed-4x5/05-aktion-winter-highlight.jpg" alt="" /></div>
    <div><img src="../export/feed-4x5/08-neuheit-f-450-gs-trophy.jpg" alt="" /></div>
  </div>
</section>
<script src="fit.js"></script>
</body>
</html>

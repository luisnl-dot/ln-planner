<style>
@font-face { font-family: 'Archivo'; src: url({{f:archivo}}) format('woff2'); font-weight: 100 900; font-stretch: 62% 125%; font-display: block; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215; }

:root {
  --nacht: #0b0c0c; --nacht2: #161817; --nacht3: #212423;
  --papier: #f1eee8; --papier2: #e6e1d7; --papier3: #d8d2c6;
  --kreide: #ece9e2; --kreide2: #bdbab3; --kreide3: #918f89;

  --m1: #3896d2; --m2: #2b5e97; --m3: #e42a24;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-io: cubic-bezier(0.76, 0, 0.24, 1);
  --s: 1;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #050606; overflow: hidden; }
body { font-family: 'Archivo', Arial, sans-serif; color: var(--kreide); -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; -webkit-tap-highlight-color: transparent; }
img, video { display: block; }
button { font: inherit; }

/* ---------- Bühne: 1920 × 1080, auf das Fenster skaliert ---------- */
.buehne { position: fixed; left: 50%; top: 50%; width: 1920px; height: 1080px; transform: translate(-50%, -50%) scale(var(--s)); overflow: hidden; background: var(--nacht); user-select: none; }
.folie { position: absolute; inset: 0; padding: 104px 120px 150px; display: flex; flex-direction: column; opacity: 0; visibility: hidden; transition: opacity 0.55s var(--ease), visibility 0s linear 0.55s; }
.folie.ist-aktiv { opacity: 1; visibility: visible; transition: opacity 0.55s var(--ease), visibility 0s; z-index: 1; }
.dunkel { background: var(--nacht); color: var(--kreide); --fg: var(--kreide); --fg2: var(--kreide2); --fg3: var(--kreide3); --linie: rgba(236, 233, 226, 0.24); --flaeche: var(--nacht2); --spur: rgba(236, 233, 226, 0.12); }
.hell { background: var(--papier); color: var(--tinte); --fg: var(--tinte); --fg2: var(--tinte2); --fg3: var(--tinte3); --linie: rgba(14, 15, 15, 0.22); --flaeche: var(--papier2); --spur: rgba(14, 15, 15, 0.1); }
.folie aside { display: none; }

/* ---------- Schrift ---------- */
.mono { font-family: 'Plex', 'Courier New', monospace; font-size: 21px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; line-height: 1.3; }
.kopf { display: flex; justify-content: space-between; align-items: baseline; gap: 40px; padding-bottom: 18px; margin-bottom: 46px; border-bottom: 2px solid var(--linie); color: var(--fg3); position: relative; z-index: 2; }
.titel { font-size: 84px; font-weight: 790; font-stretch: 104%; line-height: 0.95; letter-spacing: -0.026em; text-transform: uppercase; color: var(--fg); }
.titel.kompakt { font-size: 68px; }
h3 { font-size: 38px; font-weight: 760; font-stretch: 102%; line-height: 1.05; letter-spacing: -0.012em; text-transform: uppercase; color: var(--fg); }
.text { font-size: 28px; line-height: 1.42; color: var(--fg2); }
.text.gross { font-size: 36px; line-height: 1.3; color: var(--fg); font-weight: 500; }
.text b { color: var(--fg); font-weight: 650; }
.raum { flex: 1; min-height: 0; }
.bu { font-family: 'Plex', 'Courier New', monospace; font-size: 18px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg3); margin-top: 16px; line-height: 1.35; }
.bu span { display: block; font-family: 'Archivo', sans-serif; letter-spacing: 0; text-transform: none; font-size: 22px; font-weight: 450; color: var(--fg2); margin-top: 4px; }
.streifen { width: 52px; height: 32px; flex: none; }

/* Typenschild: Zeilen werden per Skript auf die Breite gesetzt */
.fit { display: block; width: 100%; font-weight: 800; text-transform: uppercase; letter-spacing: -0.03em; line-height: 0.9; color: var(--fg); }
.fit .maske { display: block; overflow: hidden; padding-top: 0.1em; margin-top: -0.1em; padding-bottom: 0.02em; }
.fit .z { display: block; width: max-content; white-space: nowrap; }

/* ---------- Bewegung: alles steigt ruhig auf, Bilder öffnen sich ---------- */
[data-an] { opacity: 0; transform: translate3d(0, 30px, 0); }
[data-an='bild'] { opacity: 1; transform: none; clip-path: inset(0 0 100% 0); }
[data-an='bild'] img { transform: scale(1.12); }
[data-an='kachel'] { transform: translate3d(0, 24px, 0) scale(0.94); }
[data-an='wisch'] { transform: translate3d(90px, 0, 0); }
[data-an='linie'], [data-an='balken'] { opacity: 1; transform: scaleX(0); transform-origin: 0 50%; }
[data-an='zeilen'] { opacity: 1; transform: none; }
[data-an='zeilen'] .z { transform: translate3d(0, 106%, 0); }
[data-an='punkt'] { transform: scale(0); }
.ist-gespielt [data-an] { opacity: 1; transform: none; transition: opacity 0.8s var(--ease), transform 1.05s var(--ease); transition-delay: calc(var(--d, 0.12s) + var(--i, 0) * 85ms); }
.ist-gespielt [data-an='bild'] { clip-path: inset(0); transition: clip-path 1.15s var(--ease-io); transition-delay: calc(var(--d, 0.12s) + var(--i, 0) * 85ms); }
.ist-gespielt [data-an='bild'] img { transform: none; transition: transform 1.7s var(--ease); transition-delay: calc(var(--d, 0.12s) + var(--i, 0) * 85ms); }
.ist-gespielt [data-an='linie'], .ist-gespielt [data-an='balken'] { transition: transform 1.2s var(--ease-io); transition-delay: calc(var(--d, 0.12s) + var(--i, 0) * 85ms); }
.ist-gespielt [data-an='zeilen'] .z { transform: none; transition: transform 1.05s var(--ease); transition-delay: calc(var(--d, 0.12s) + var(--i, 0) * 85ms + var(--zi, 0) * 95ms); }
.ist-gespielt [data-an='punkt'] { transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); transition-delay: calc(var(--d, 0.12s) + var(--i, 0) * 85ms); }

/* ---------- Fußzeile jeder Folie (vom Skript eingesetzt) ---------- */
.folien-fuss { position: absolute; left: 120px; right: 120px; bottom: 42px; z-index: 3; }
.spur { height: 2px; background: var(--spur); margin-bottom: 16px; }
.spur span { display: block; height: 100%; background: var(--fg3); transform-origin: 0 50%; }
.fuss-zeile { display: flex; justify-content: space-between; align-items: center; font-family: 'Plex', 'Courier New', monospace; font-size: 18px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg3); }

/* ---------- Bildrahmen ---------- */

/* ---------- 01 Titel: Lichtkante ---------- */
.c2 { padding: 0; overflow: hidden; }
.c2-glut { position: absolute; inset: 0; background: radial-gradient(48% 62% at 80% 38%, rgba(43, 94, 151, 0.3), transparent 72%), radial-gradient(34% 40% at 95% 96%, rgba(228, 42, 36, 0.2), transparent 70%); }
.c2-wand { position: absolute; left: 1060px; top: -250px; display: flex; gap: 30px; transform: rotate(-13deg); transform-origin: 50% 50%; }
.c2-spalte { display: flex; flex-direction: column; gap: 30px; margin-top: var(--y, 0); }
.c2-karte { width: 330px; height: 412px; border-radius: 6px; overflow: hidden; background: var(--nacht2); box-shadow: 0 0 0 1px rgba(236, 233, 226, 0.07), 0 40px 70px -24px rgba(0, 0, 0, 0.9); }

.c2-text { position: absolute; left: 120px; top: 104px; bottom: 96px; width: 780px; display: flex; flex-direction: column; justify-content: space-between; z-index: 2; }
.c2-marke { display: inline-flex; align-items: center; gap: 20px; align-self: flex-start; color: var(--kreide); }
.c2-bmw { font-size: 25px; font-weight: 780; font-stretch: 112%; line-height: 0.98; letter-spacing: 0.01em; text-transform: uppercase; padding-right: 22px; border-right: 2px solid rgba(236, 233, 226, 0.35); }
.c2-marke svg { width: 58px; height: 36px; }
.c2-name { font-size: 54px; font-weight: 800; font-stretch: 125%; letter-spacing: -0.02em; line-height: 1; text-transform: uppercase; }
.c2-kicker { display: flex; align-items: center; gap: 22px; margin-bottom: 44px; font-size: 24px; font-weight: 700; font-stretch: 125%; letter-spacing: 0.15em; text-transform: uppercase; color: var(--kreide); }

/* ---------- Kapitel ---------- */
.kapitel-bild { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.08); }
.ist-gespielt .kapitel-bild { transform: none; transition: transform 7s cubic-bezier(0.2, 0.6, 0.2, 1); }
.kapitel-schleier { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(11, 12, 12, 0.8), rgba(11, 12, 12, 0.15) 30%, rgba(11, 12, 12, 0.25) 52%, rgba(11, 12, 12, 0.92) 88%); }

/* ---------- 02 Idee ---------- */
.idee { display: grid; grid-template-columns: 760px 380px 1fr; gap: 48px; align-items: start; }

/* ---------- Profil ---------- */
.profil-bild { position: absolute; left: 120px; top: 104px; width: 520px; height: 790px; border-radius: 22px; box-shadow: 0 0 0 2px rgba(236, 233, 226, 0.14); }

/* ---------- Aufbau ---------- */

/* ---------- Karussell, Stories, Reels ---------- */
.reihe { display: flex; gap: 28px; }

/* ---------- Drehpläne ---------- */
.schritte { list-style: none; counter-reset: s; display: grid; gap: 10px; margin-top: 6px; }
.schritte li { counter-increment: s; display: grid; grid-template-columns: 42px 1fr; font-size: 25px; line-height: 1.35; color: var(--fg2); }

/* ---------- Redaktionsplan ---------- */
.kalender { display: grid; grid-template-columns: 220px repeat(3, 1fr) 360px; gap: 10px; }

.k-zelle { background: var(--flaeche); padding: 18px 20px; font-size: 24px; line-height: 1.3; color: var(--fg); min-height: 104px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; }

/* ---------- Ablauf ---------- */
.zeitstrahl { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); gap: 40px; padding-top: 58px; }

/* ---------- Kennzahlen ---------- */

/* ---------- Website ---------- */

.funktionen { display: grid; grid-template-columns: repeat(4, 1fr); gap: 36px; }
.funktion { display: flex; flex-direction: column; gap: 14px; }

.fakten { margin-top: 40px; padding-top: 20px; border-top: 2px solid var(--linie); color: var(--fg2); }

.formate { display: flex; gap: 40px; }

.k6 { gap: 22px; }
.k6 .bildrahmen { width: 260px; height: 325px; }
.raster-hg { background-color: #f3f1eb; background-image: linear-gradient(rgba(31, 79, 156, 0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(31, 79, 156, 0.07) 1px, transparent 1px); background-size: 60px 60px; background-position: -1px -1px; }
.zeitstrahl.vier { grid-template-columns: repeat(4, 1fr); }
.wochen { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 40px; }
.wochen > div { background: var(--flaeche); padding: 20px 22px; display: grid; gap: 8px; }
.wochen p { font-size: 23px; line-height: 1.3; color: var(--fg); }
.wochen p.mono { font-size: 17px; color: var(--fg3); margin-bottom: 4px; }
.wochen p.leise { color: var(--fg3); }
.reel-mark { display: inline-block; padding: 2px 9px; margin-right: 8px; border-radius: 6px; background: var(--fg); color: var(--papier); font-family: 'Plex', monospace; font-size: 15px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; vertical-align: 3px; }

/* ---------- Bedienung außerhalb der Bühne ---------- */
.steuer { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); display: flex; gap: 6px; z-index: 40; transition: opacity 0.4s; }
.steuer button { all: unset; cursor: pointer; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; background: rgba(22, 24, 23, 0.78); color: #ece9e2; box-shadow: 0 0 0 1px rgba(236, 233, 226, 0.12); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.steuer button:hover { background: rgba(48, 51, 50, 0.92); }
.steuer button:focus-visible, .zelle:focus-visible, .schliessen:focus-visible { outline: 2px solid var(--m1); outline-offset: 2px; }
.steuer svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
body.ruhend .steuer { opacity: 0; }
body.ruhend { cursor: none; }

.ebene { position: fixed; inset: 0; z-index: 60; display: none; }
.ebene.offen { display: block; }
.uebersicht { background: rgba(5, 6, 6, 0.96); overflow-y: auto; padding: 72px max(24px, 4vw) 48px; }
.uebersicht-kopf, .hilfe-kopf { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; font-family: 'Plex', monospace; font-size: 14px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--kreide3); }
.schliessen { all: unset; cursor: pointer; padding: 8px 12px; border-radius: 8px; color: var(--kreide); box-shadow: 0 0 0 1px rgba(236, 233, 226, 0.2); }
.raster-ueb { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 26px 20px; }
.zelle { all: unset; cursor: pointer; display: block; }
.zelle-bild { position: relative; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 8px; box-shadow: 0 0 0 1px rgba(236, 233, 226, 0.12); transition: box-shadow 0.2s, transform 0.3s var(--ease); }
.zelle:hover .zelle-bild { transform: translateY(-3px); box-shadow: 0 0 0 2px rgba(236, 233, 226, 0.5); }
.zelle.ist-hier .zelle-bild { box-shadow: 0 0 0 3px var(--m1); }
.zelle-innen { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; transform: scale(var(--z, 0.15)); pointer-events: none; }
.zelle-innen .folie { opacity: 1 !important; visibility: visible !important; }
.zelle-innen .folie, .zelle-innen .folie * { transition: none !important; animation: none !important; }
.zelle-nr { display: block; margin-top: 10px; font-family: 'Plex', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--kreide2); }

.notizen { top: auto; background: rgba(12, 13, 13, 0.94); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-top: 1px solid rgba(236, 233, 226, 0.16); padding: 22px max(24px, 4vw) 28px; max-height: 42vh; overflow-y: auto; }
.notizen p { font-size: clamp(16px, 1.5vw, 22px); line-height: 1.5; color: var(--kreide); max-width: 70em; margin-top: 10px; }
.hilfe { background: rgba(5, 6, 6, 0.9); display: none; place-items: center; padding: 24px; }
.hilfe.offen { display: grid; }
.hilfe-karte { width: min(560px, 100%); background: var(--nacht2); border-radius: 16px; padding: 28px 30px; box-shadow: 0 0 0 1px rgba(236, 233, 226, 0.14); }
.hilfe dl { display: grid; grid-template-columns: auto 1fr; gap: 12px 24px; font-size: 17px; color: var(--kreide2); }
.hilfe dt { font-family: 'Plex', monospace; font-weight: 500; color: var(--kreide); }
.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translate(-50%, 20px); z-index: 50; padding: 12px 18px; border-radius: 12px; background: rgba(22, 24, 23, 0.88); color: var(--kreide2); font-family: 'Plex', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0; transition: opacity 0.5s, transform 0.5s var(--ease); pointer-events: none; white-space: nowrap; }
.toast.zeigen { opacity: 1; transform: translate(-50%, 0); }
.lade { position: fixed; inset: 0; z-index: 80; background: var(--nacht); display: grid; place-items: center; transition: opacity 0.6s; }
.lade svg { width: 78px; height: 48px; }
.lade.weg { opacity: 0; pointer-events: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Bewegung reduzieren: alles steht sofort */
.ruhig [data-an], .ruhig [data-an] *, .ruhig .kapitel-bild { opacity: 1 !important; transform: none !important; clip-path: none !important; transition: none !important; }
.ruhig .folie { transition: none; }

/* Drucken / als PDF sichern: jede Folie eine Seite, alles im Endzustand */
@media print {
  @page { size: 1920px 1080px; margin: 0; }
  html, body { height: auto; overflow: visible; background: none; }
  .buehne { position: static; transform: none; width: 1920px; height: auto; overflow: visible; }
  .folie { position: relative; width: 1920px; height: 1080px; opacity: 1 !important; visibility: visible !important; break-after: page; page-break-after: always; transition: none !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  [data-an], [data-an] *, .kapitel-bild { opacity: 1 !important; transform: none !important; clip-path: none !important; transition: none !important; }
  .folie:last-of-type { break-after: auto; page-break-after: auto; }
  .steuer, .ebene, .toast, .lade, .sr, noscript { display: none !important; }
}
/* Handy und Tablet: weniger Knöpfe (gewischt wird ohnehin), kleiner */
@media (pointer: coarse) {
  .steuer button[data-tu='notizen'], .steuer button[data-tu='zurueck'], .steuer button[data-tu='weiter'] { display: none; }
}
@media (max-height: 560px), (max-width: 700px) {
  .steuer button { width: 34px; height: 34px; border-radius: 9px; }
  .steuer svg { width: 16px; height: 16px; }
  .toast { font-size: 11px; padding: 9px 13px; }
}
</style>
</head>
<body>
<div class="lade" data-lade><svg viewBox="0 0 26 16" aria-hidden="true"><path d="M5 0h5L5 16H0z" fill="#3896D2"/><path d="M13 0h5l-5 16H8z" fill="#2B5E97"/><path d="M21 0h5l-5 16h-5z" fill="#E42A24"/></svg></div>
<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;color:#ece9e2;font:20px Arial;z-index:90;background:#0b0c0c">Bitte JavaScript aktivieren, um die Präsentation zu zeigen.</p></noscript>

<main class="buehne" aria-label="Präsentation: Website und Instagram für BMW Motorrad Martin">
{{FOLIEN}}
</main>

<!-- ============ Bedienung ============ -->
<div class="steuer" data-steuer>
  <button type="button" data-tu="uebersicht" aria-label="Übersicht aller Folien (O)"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.2"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.2"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.2"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.2"/></svg></button>
  <button type="button" data-tu="notizen" aria-label="Sprechernotizen (N)"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 11h14M5 16h9"/></svg></button>
  <button type="button" data-tu="vollbild" aria-label="Vollbild (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button type="button" data-tu="zurueck" aria-label="Vorherige Folie"><svg viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></button>
  <button type="button" data-tu="weiter" aria-label="Nächste Folie"><svg viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg></button>
</div>

<div class="ebene uebersicht" data-ebene="uebersicht" role="dialog" aria-modal="true" aria-label="Übersicht aller Folien">
  <div class="uebersicht-kopf"><span>Alle Folien · Klick zum Springen</span><button type="button" class="schliessen" data-tu="uebersicht">Schließen · Esc</button></div>
  <div class="raster-ueb" data-raster-ueb></div>
</div>

<div class="ebene notizen" data-ebene="notizen" aria-label="Sprechernotizen">
  <div class="uebersicht-kopf" style="margin-bottom: 0"><span data-notiz-titel></span><button type="button" class="schliessen" data-tu="notizen">Schließen · N</button></div>
  <p data-notiz-text></p>
</div>

<div class="ebene hilfe" data-ebene="hilfe" role="dialog" aria-modal="true" aria-label="Tastenkürzel">
  <div class="hilfe-karte">
    <div class="hilfe-kopf"><span>Bedienung</span><button type="button" class="schliessen" data-tu="hilfe">Schließen</button></div>
    <dl>
      <dt>→ · Leertaste</dt><dd>Nächste Folie</dd>
      <dt>←</dt><dd>Vorherige Folie</dd>
      <dt>Pos1 · Ende</dt><dd>Erste · letzte Folie</dd>
      <dt>O · Esc</dt><dd>Übersicht aller Folien</dd>
      <dt>N</dt><dd>Sprechernotizen</dd>
      <dt>F</dt><dd>Vollbild</dd>
      <dt>Klick · Wischen</dt><dd>Rechts weiter, links zurück</dd>
      <dt>Drucken</dt><dd>Als PDF sichern, eine Folie pro Seite</dd>
    </dl>
  </div>
</div>

<div class="toast" data-toast></div>
<p class="sr" aria-live="polite" data-ansage></p>

<script>
const MEDIEN = {{MEDIEN}};
</script>
<script>
(() => {
  const html = document.documentElement;
  const buehne = document.querySelector('.buehne');
  const folien = Array.from(buehne.querySelectorAll('.folie'));
  const n = folien.length;
  const ruhig = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (ruhig) html.classList.add('ruhig');
  const zwei = (x) => String(x).padStart(2, '0');
  const STREIFEN = '<svg viewBox="0 0 26 16" aria-hidden="true"><path d="M5 0h5L5 16H0z" fill="#3896D2"/><path d="M13 0h5l-5 16H8z" fill="#2B5E97"/><path d="M21 0h5l-5 16h-5z" fill="#E42A24"/></svg>';
  let ist = -1;
  let S = 1;

  /* Medien einsetzen (jedes Bild steht nur einmal in der Datei) */
  document.querySelectorAll('[data-bild]').forEach((el) => (el.src = MEDIEN[el.dataset.bild]));
  document.querySelectorAll('[data-poster]').forEach((el) => (el.poster = MEDIEN[el.dataset.poster]));
  document.querySelectorAll('[data-video]').forEach((el) => (el.src = MEDIEN[el.dataset.video]));

  /* Fußzeilen, Reihenfolge der Bewegung, Barrierefreiheit */
  folien.forEach((f, k) => {
    f.setAttribute('role', 'group');
    f.setAttribute('aria-roledescription', 'Folie');
    f.setAttribute('aria-label', `${k + 1} von ${n}: ${f.dataset.titel}`);
    f.setAttribute('aria-hidden', 'true');
    f.inert = true;
    f.querySelectorAll('[data-an]').forEach((el, i) => {
      if (!el.style.getPropertyValue('--i')) el.style.setProperty('--i', Math.min(i, 14));
    });
    f.querySelectorAll('.fit').forEach((fit) => fit.querySelectorAll('.z').forEach((z, i) => z.style.setProperty('--zi', i)));
    if (f.hasAttribute('data-ohne-fuss')) return;
    const fuss = document.createElement('div');
    fuss.className = 'folien-fuss';
    fuss.innerHTML = `<div class="spur"><span style="transform:scaleX(${((k + 1) / n).toFixed(4)})"></span></div><div class="fuss-zeile"><span class="fuss-marke">${STREIFEN}<span>BMW Motorrad Martin · Website und Instagram</span></span><span>${zwei(k + 1)} / ${zwei(n)}</span></div>`;
    f.append(fuss);
  });

  /* Skalierung auf das Fenster */
  const skaliere = () => {
    S = Math.min(innerWidth / 1920, innerHeight / 1080);
    html.style.setProperty('--s', S);
    if (offen('uebersicht')) passeUebersicht();
  };

  /* Typenschild: jede Zeile über die Breitenachse auf die volle Breite */
  const MIN = 62;
  const MAX = 125;
  const breite = (el) => el.getBoundingClientRect().width / S;
  function setze(el) {
    const ziel = el.clientWidth;
    const zeilen = Array.from(el.querySelectorAll('.z'));
    if (!zeilen.length || !ziel) return;
    el.style.fontSize = '100px';
    zeilen.forEach((z) => (z.style.fontSize = ''));
    const messe = (z, w) => { z.style.fontStretch = w + '%'; return breite(z); };
    const m = zeilen.map((z) => ({ z, schmal: messe(z, MIN), breit: messe(z, MAX) }));
    let gruppe = [...m];
    let unten = 0;
    let oben = 0;
    for (;;) {
      unten = Math.max(...gruppe.map((x) => (100 * ziel) / x.breit));
      oben = Math.min(...gruppe.map((x) => (100 * ziel) / x.schmal));
      if (unten <= oben || gruppe.length === 1) break;
      const kurz = gruppe.reduce((a, b) => (a.breit < b.breit ? a : b));
      gruppe = gruppe.filter((x) => x !== kurz);
    }
    const groesse = Math.min(oben, unten * 1.06);
    const soll = (ziel * 100) / groesse;
    for (const { z, schmal, breit: b } of m) {
      if (b <= soll) { z.style.fontStretch = MAX + '%'; z.style.fontSize = (soll / b).toFixed(4) + 'em'; continue; }
      if (schmal >= soll) { z.style.fontStretch = MIN + '%'; z.style.fontSize = (soll / schmal).toFixed(4) + 'em'; continue; }
      let lo = MIN;
      let hi = MAX;
      for (let i = 0; i < 14; i++) { const mid = (lo + hi) / 2; if (messe(z, mid) > soll) hi = mid; else lo = mid; }
      z.style.fontStretch = lo.toFixed(2) + '%';
    }
    el.style.fontSize = groesse.toFixed(2) + 'px';
    for (let lauf = 0; lauf < 3; lauf++) {
      for (const { z } of m) {
        const w = breite(z);
        if (!w || Math.abs(w - ziel) < 0.5) continue;
        const em = parseFloat(z.style.fontSize) || 1;
        z.style.fontSize = ((em * (ziel - 0.5)) / w).toFixed(4) + 'em';
      }
    }
  }

  /* Zahlen zählen beim Erscheinen hoch */
  const zaehle = (f) => f.querySelectorAll('[data-zahl]').forEach((el) => {
    const ziel = Number(el.dataset.zahl);
    if (ruhig) return;
    const i = Number(el.closest('[data-an]')?.style.getPropertyValue('--i') || 0);
    const start = performance.now() + 260 + i * 85;
    const dauer = 1500;
    el.textContent = '0';
    const schritt = (t) => {
      if (!f.classList.contains('ist-gespielt')) { el.textContent = String(ziel); return; }
      const p = Math.min(1, Math.max(0, (t - start) / dauer));
      const e = p === 1 ? 1 : 1 - Math.pow(2, -10 * p);
      el.textContent = String(Math.round(ziel * e));
      if (p < 1) requestAnimationFrame(schritt);
    };
    requestAnimationFrame(schritt);
  });

  /* Wechsel */
  const ansage = document.querySelector('[data-ansage]');
  function zeige(k) {
    k = Math.max(0, Math.min(n - 1, k));
    if (k === ist) return;
    const alt = folien[ist];
    if (alt) {
      alt.classList.remove('ist-aktiv');
      alt.setAttribute('aria-hidden', 'true');
      alt.inert = true;
      alt.querySelectorAll('video').forEach((v) => v.pause());
      setTimeout(() => {
        if (alt.classList.contains('ist-aktiv')) return;
        alt.classList.remove('ist-gespielt');
        alt.querySelectorAll('video').forEach((v) => { try { v.currentTime = 0; } catch (e) {} });
      }, 650);
    }
    ist = k;
    const f = folien[k];
    f.classList.add('ist-aktiv');
    f.removeAttribute('aria-hidden');
    f.inert = false;
    if (!f.classList.contains('ist-gespielt')) {
      requestAnimationFrame(() => requestAnimationFrame(() => { f.classList.add('ist-gespielt'); zaehle(f); }));
    }
    f.querySelectorAll('video').forEach((v) => { v.muted = true; const p = v.play(); if (p && p.catch) p.catch(() => {}); });
    try { history.replaceState(null, '', '#' + (k + 1)); } catch (e) {}
    ansage.textContent = `Folie ${k + 1} von ${n}: ${f.dataset.titel}`;
    document.querySelector('[data-notiz-titel]').textContent = `${zwei(k + 1)} / ${zwei(n)} · ${f.dataset.titel}`;
    document.querySelector('[data-notiz-text]').textContent = f.querySelector('aside')?.textContent.trim() || 'Keine Notizen zu dieser Folie.';
    document.querySelectorAll('.zelle').forEach((z, i) => z.classList.toggle('ist-hier', i === k));
  }
  const weiter = () => zeige(ist + 1);
  const zurueck = () => zeige(ist - 1);

  /* Ebenen: Übersicht, Notizen, Hilfe */
  const ebene = (name) => document.querySelector(`[data-ebene="${name}"]`);
  const offen = (name) => ebene(name).classList.contains('offen');
  let uebersichtGebaut = false;
  function baueUebersicht() {
    const raster = document.querySelector('[data-raster-ueb]');
    folien.forEach((f, k) => {
      const zelle = document.createElement('button');
      zelle.type = 'button';
      zelle.className = 'zelle';
      zelle.setAttribute('aria-label', `Folie ${k + 1}: ${f.dataset.titel}`);
      const bild = document.createElement('div');
      bild.className = 'zelle-bild';
      const innen = document.createElement('div');
      innen.className = 'zelle-innen';
      const kopie = f.cloneNode(true);
      kopie.classList.add('ist-aktiv', 'ist-gespielt');
      kopie.removeAttribute('aria-label');
      kopie.setAttribute('aria-hidden', 'true');
      kopie.querySelectorAll('aside').forEach((a) => a.remove());
      kopie.querySelectorAll('video').forEach((v) => { v.removeAttribute('src'); v.preload = 'none'; v.autoplay = false; });
      kopie.querySelectorAll('[data-zahl]').forEach((z) => (z.textContent = z.dataset.zahl));
      innen.append(kopie);
      bild.append(innen);
      const nr = document.createElement('span');
      nr.className = 'zelle-nr';
      nr.textContent = `${zwei(k + 1)} · ${f.dataset.titel}`;
      zelle.append(bild, nr);
      zelle.addEventListener('click', () => { schliesse('uebersicht'); zeige(k); });
      raster.append(zelle);
    });
    uebersichtGebaut = true;
  }
  function passeUebersicht() {
    const z = document.querySelector('.zelle-bild');
    if (z) document.querySelector('[data-raster-ueb]').style.setProperty('--z', z.clientWidth / 1920);
  }
  function oeffne(name) {
    if (name === 'uebersicht') {
      if (!uebersichtGebaut) baueUebersicht();
      schliesse('notizen');
    }
    ebene(name).classList.add('offen');
    if (name === 'uebersicht') {
      passeUebersicht();
      document.querySelectorAll('.zelle').forEach((z, i) => z.classList.toggle('ist-hier', i === ist));
      const hier = document.querySelectorAll('.zelle')[ist];
      if (hier) { hier.focus({ preventScroll: true }); hier.scrollIntoView({ block: 'center' }); }
    }
  }
  function schliesse(name) { ebene(name).classList.remove('offen'); }
  const umschalten = (name) => (offen(name) ? schliesse(name) : oeffne(name));

  const vollbild = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (html.requestFullscreen) html.requestFullscreen().catch(() => {});
  };

  document.querySelectorAll('[data-tu]').forEach((b) => b.addEventListener('click', (e) => {
    e.stopPropagation();
    const tu = b.dataset.tu;
    if (tu === 'weiter') weiter();
    else if (tu === 'zurueck') zurueck();
    else if (tu === 'vollbild') vollbild();
    else umschalten(tu);
  }));

  /* Tastatur */
  document.addEventListener('keydown', (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const k = e.key;
    if (offen('hilfe')) { if (k === 'Escape' || k === '?' || k === 'h' || k === 'H') { e.preventDefault(); schliesse('hilfe'); } return; }
    if (offen('uebersicht')) {
      if (k === 'Escape' || k === 'o' || k === 'O') { e.preventDefault(); schliesse('uebersicht'); return; }
      const zellen = Array.from(document.querySelectorAll('.zelle'));
      const jetzt = zellen.indexOf(document.activeElement);
      const spalten = Math.max(1, Math.round(document.querySelector('[data-raster-ueb]').clientWidth / (zellen[0].clientWidth + 20)));
      const ziel = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: spalten, ArrowUp: -spalten }[k];
      if (ziel !== undefined) { e.preventDefault(); const z = zellen[Math.max(0, Math.min(zellen.length - 1, (jetzt < 0 ? ist : jetzt) + ziel))]; z.focus(); z.scrollIntoView({ block: 'nearest' }); }
      return;
    }
    if (e.target.closest && e.target.closest('button') && (k === 'Enter' || k === ' ')) return;
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(k)) { e.preventDefault(); weiter(); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(k)) { e.preventDefault(); zurueck(); }
    else if (k === 'Home') { e.preventDefault(); zeige(0); }
    else if (k === 'End') { e.preventDefault(); zeige(n - 1); }
    else if (k === 'Escape' || k === 'o' || k === 'O') { e.preventDefault(); if (offen('notizen') && k === 'Escape') schliesse('notizen'); else oeffne('uebersicht'); }
    else if (k === 'n' || k === 'N') { e.preventDefault(); umschalten('notizen'); }
    else if (k === 'f' || k === 'F') { e.preventDefault(); vollbild(); }
    else if (k === '?' || k === 'h' || k === 'H') { e.preventDefault(); oeffne('hilfe'); }
  });

  /* Klick und Wischen: rechts weiter, links zurück */
  let start = null;
  let gewischt = false;
  buehne.addEventListener('pointerdown', (e) => { start = { x: e.clientX, y: e.clientY }; gewischt = false; });
  buehne.addEventListener('pointerup', (e) => {
    if (!start) return;
    const dx = e.clientX - start.x;
    const dy = e.clientY - start.y;
    start = null;
    if (Math.abs(dx) > 44 && Math.abs(dx) > Math.abs(dy) * 1.2) { gewischt = true; dx < 0 ? weiter() : zurueck(); }
  });
  buehne.addEventListener('click', (e) => {
    if (gewischt) { gewischt = false; return; }
    if (e.target.closest('a, button')) return;
    const r = buehne.getBoundingClientRect();
    if (e.clientX < r.left + r.width * 0.3) zurueck(); else weiter();
  });

  /* Mausrad und Trackpad: eine Geste = eine Folie */
  let radAktiv = false;
  let radZeit = 0;
  addEventListener('wheel', (e) => {
    if (offen('uebersicht') || offen('hilfe') || (offen('notizen') && e.target.closest('[data-ebene="notizen"]'))) return;
    e.preventDefault();
    clearTimeout(radZeit);
    radZeit = setTimeout(() => (radAktiv = false), 240);
    if (radAktiv) return;
    const d = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
    if (Math.abs(d) < 6) return;
    radAktiv = true;
    d > 0 ? weiter() : zurueck();
  }, { passive: false });

  /* Bedienleiste blendet sich aus, wenn die Maus ruht */
  let ruhe = 0;
  const wach = () => {
    document.body.classList.remove('ruhend');
    clearTimeout(ruhe);
    ruhe = setTimeout(() => { if (!offen('uebersicht') && !offen('hilfe')) document.body.classList.add('ruhend'); }, 2600);
  };
  addEventListener('mousemove', wach);
  addEventListener('touchstart', wach, { passive: true });

  const toast = (text, ms = 3800) => {
    const t = document.querySelector('[data-toast]');
    t.textContent = text;
    t.classList.add('zeigen');
    setTimeout(() => t.classList.remove('zeigen'), ms);
  };

  /* Start: erst wenn die Schriften da sind, damit das Typenschild exakt sitzt */
  addEventListener('resize', skaliere);
  skaliere();
  Promise.all([
    document.fonts.load('800 100px Archivo'),
    document.fonts.load('500 20px Plex'),
    document.fonts.load('400 20px Plex'),
  ]).catch(() => {}).then(() => document.fonts.ready).then(() => {
    document.querySelectorAll('.buehne .fit').forEach(setze);
    const h = parseInt(location.hash.slice(1), 10);
    zeige(Number.isFinite(h) && h >= 1 && h <= n ? h - 1 : 0);
    document.querySelector('[data-lade]').classList.add('weg');
    wach();
    const touch = matchMedia('(pointer: coarse)').matches;
    if (touch && innerHeight > innerWidth) toast('Quer halten für die beste Ansicht');
    else toast(touch ? 'Wischen zum Blättern' : '← → blättern · O Übersicht · N Notizen · ? Hilfe');
    window.__bereit = true;
  });
})();
</script>
